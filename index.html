<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メディカル問題暗記・復習ノート</title>
  <link rel="stylesheet" href="styles.css">
  <!-- グラフ描画用ライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header>
    <h1>MedNote Pro</h1>
    <nav>
      <button class="nav-btn active" onclick="switchTab('questions')">問題一覧・検索</button>
      <button class="nav-btn" onclick="switchTab('add')">＋問題追加</button>
      <button class="nav-btn" onclick="switchTab('review')">復習・学習</button>
      <button class="nav-btn" onclick="switchTab('analytics')">学習分析</button>
      <button class="nav-btn" onclick="switchTab('settings')">通知・設定</button>
    </nav>
  </header>

  <main>
    <!-- カウントダウンバー -->
    <div id="countdown-bar" class="banner">
      試験日まであと <span id="days-left">--</span> 日！
    </div>

    <!-- 1. 問題一覧・検索 タブ -->
    <section id="tab-questions" class="tab-content active">
      <h2>問題ライブラリ</h2>
      <div class="filter-panel">
        <input type="text" id="search-input" placeholder="タイトル・本文・疾患名で検索..." oninput="renderQuestions()">
        
        <div class="filter-row">
          <select id="filter-subject" onchange="renderQuestions()">
            <option value="">すべての科目</option>
            <option value="内科">内科</option>
            <option value="外科">外科</option>
            <option value="産婦人科">産婦人科</option>
            <option value="小児科">小児科</option>
          </select>

          <select id="filter-folder" onchange="renderQuestions()">
            <option value="">すべてのフォルダ</option>
          </select>

          <select id="filter-label" onchange="renderQuestions()">
            <option value="">すべてのラベル</option>
            <option value="苦手">苦手</option>
            <option value="頻出">頻出</option>
            <option value="要暗記">要暗記</option>
          </select>
        </div>
      </div>

      <div id="questions-list" class="grid-container"></div>
    </section>

    <!-- 2. 問題追加・編集 タブ -->
    <section id="tab-add" class="tab-content">
      <h2 id="form-title">問題を登録する</h2>
      <form id="question-form" onsubmit="handleSaveQuestion(event)">
        <input type="hidden" id="edit-id" value="">

        <div class="form-group">
          <label>タイトル *</label>
          <input type="text" id="q-title" required placeholder="例：PCOSのホルモン値">
        </div>

        <!-- 画像 ＆ OCR機能 -->
        <div class="form-group">
          <label>問題画像（カメラ撮影・ファイル選択：複数可）</label>
          <input type="file" id="q-images" accept="image/*" multiple capture="environment" onchange="handleImageUpload(event)">
          <div id="image-preview" class="preview-container"></div>
          <button type="button" class="btn secondary" onclick="runOCR()">📷 画像からOCR文字認識を実行</button>
        </div>

        <div class="form-group">
          <label>問題文（OCR結果または手入力）</label>
          <textarea id="q-ocr-text" rows="4" placeholder="問題文がここに読み込まれます..."></textarea>
        </div>

        <div class="form-group">
          <label>メモ・解説</label>
          <textarea id="q-memo" rows="3" placeholder="LH/FSH比上昇、エストロン高値など"></textarea>
        </div>

        <!-- 分類機能 -->
        <div class="form-row">
          <div class="form-group">
            <label>科目</label>
            <input type="text" id="q-subject" placeholder="内科, 産婦人科 など">
          </div>
          <div class="form-group">
            <label>分野</label>
            <input type="text" id="q-field" placeholder="循環器, 生殖内分泌 など">
          </div>
          <div class="form-group">
            <label>疾患名</label>
            <input type="text" id="q-disease" placeholder="子宮体癌, PCOS など">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>タグ（カンマ区切り）</label>
            <input type="text" id="q-tags" placeholder="必修, 過去問2023, 117A12">
          </div>
          <div class="form-group">
            <label>ラベル</label>
            <select id="q-label">
              <option value="">なし</option>
              <option value="苦手">苦手</option>
              <option value="頻出">頻出</option>
              <option value="要暗記">要暗記</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>所属フォルダ（複数選択可 Ctrl/Cmd+Click）</label>
          <select id="q-folders" multiple class="multi-select"></select>
          <small>※新しいフォルダを作成する場合は設定タブから行えます</small>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn primary">保存する</button>
          <button type="button" class="btn danger" onclick="resetForm()">キャンセル</button>
        </div>
      </form>
    </section>

    <!-- 3. 復習・学習 タブ -->
    <section id="tab-review" class="tab-content">
      <h2>問題の復習</h2>
      <div class="review-presets">
        <button class="btn" onclick="filterReviewList('all')">全問題</button>
        <button class="btn warning" onclick="filterReviewList('due')">今日復習すべき問題</button>
        <button class="btn danger" onclick="filterReviewList('incorrect')">間違えた問題</button>
        <button class="btn secondary" onclick="filterReviewList('bedtime')">寝る前に復習</button>
        <button class="btn secondary" onclick="filterReviewList('exam')">試験直前に復習</button>
        <button class="btn secondary" onclick="filterReviewList('unseen')">長期間見ていない問題</button>
      </div>

      <div id="review-list" class="grid-container"></div>
    </section>

    <!-- 4. 学習分析 タブ -->
    <section id="tab-analytics" class="tab-content">
      <h2>学習データの分析</h2>
      <div id="weakness-alert" class="alert-box"></div>

      <div class="chart-grid">
        <div class="chart-card">
          <h3>科目別 正答率 (%)</h3>
          <canvas id="subjectChart"></canvas>
        </div>
        <div class="chart-card">
          <h3>学習時間の推移 (分)</h3>
          <canvas id="timeChart"></canvas>
        </div>
      </div>
    </section>

    <!-- 5. 設定・通知 タブ -->
    <section id="tab-settings" class="tab-content">
      <h2>アプリ・通知設定</h2>
      
      <div class="card">
        <h3>フォルダ管理</h3>
        <div class="input-group">
          <input type="text" id="new-folder-name" placeholder="新しいフォルダ名">
          <button class="btn primary" onclick="addFolder()">追加</button>
        </div>
        <ul id="folder-list"></ul>
      </div>

      <div class="card">
        <h3>試験日設定</h3>
        <div class="input-group">
          <input type="date" id="exam-date-input" onchange="setExamDate(this.value)">
        </div>
      </div>

      <div class="card">
        <h3>通知機能シミュレータ</h3>
        <p>（ブラウザでWeb Notificationをシミュレートします）</p>
        <button class="btn primary" onclick="triggerNotification('朝の通知', '今日の復習対象問題は 5 問あります！')">朝の通知のテスト</button>
        <button class="btn primary" onclick="triggerNotification('夜の通知', '今日の学習目標は達成できましたか？寝る前の復習をしましょう。')">夜の通知のテスト</button>
        <button class="btn success" onclick="triggerNotification('目標達成！', '本日の目標学習時間をクリアしました！お疲れ様です！')">目標達成通知のテスト</button>
      </div>
    </section>

    <!-- 問題詳細・回答用モーダル -->
    <div id="modal" class="modal">
      <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <div id="modal-body"></div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
